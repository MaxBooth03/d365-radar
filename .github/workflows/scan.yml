name: D365 Radar scan

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, all day, every day (UTC)
  workflow_dispatch:
    inputs:
      force_all:
        description: "Run every source now, ignoring the 4-hour throttle"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: d365-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan job sources
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ATS_TARGETS: ${{ secrets.ATS_TARGETS }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
        run: python scanner/scan.py

      - name: Save results
        run: |
          git config user.name "d365-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Radar update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
