name: Discover employer job feeds

on:
  push:
    branches: [main]
    paths: ["scanner/probe.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d365-radar
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/probe.py
      - name: Save results
        run: |
          git config user.name "d365-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git commit -m "Employer feed discovery results" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
